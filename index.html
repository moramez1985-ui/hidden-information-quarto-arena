<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3f0e9">
    <title>Quarto</title>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="/qurto.-simple.css">
</head>

<body>
    <main class="table">
        <header class="table-header">
            <h1>Quarto</h1>
            <div class="game-controls">
                <label for="mode-select">Mode</label>
                <select id="mode-select">
                    <option value="classic">Classic</option>
                    <option value="self_selection">Self selection</option>
                </select>
                <button id="new-game" class="new-game-button" type="button">New game</button>
            </div>
        </header>

        <section class="turn-panel" aria-label="Game status">
            <p id="game-status" role="status" aria-live="polite">Connecting to the local game...</p>
            <div id="turn-piece" class="turn-piece" hidden>
                <span id="turn-piece-label" class="turn-piece-label">Piece to place</span>
                <span id="turn-piece-preview" class="piece-preview"></span>
            </div>
            <div id="win-reason" class="win-reason" hidden></div>
        </section>

        <div class="connection-row">
            <p id="connection-error" class="connection-error" role="alert" hidden></p>
            <button id="retry-state" class="retry-button" type="button" hidden>Retry connection</button>
        </div>

        <div class="last-move">
            <span class="last-move-label">Last move</span>
            <span id="last-move-preview" class="last-move-preview" hidden></span>
            <span id="last-action">No moves yet</span>
        </div>

        <div class="game-table">
            <section class="board-area" aria-label="Game board">
                <div id="board-grid" class="board-grid" role="grid" aria-label="Quarto board"></div>
            </section>

            <aside class="pieces-area" aria-label="Available pieces">
                <div class="pieces-heading">
                    <h2>Pieces</h2>
                    <span id="pieces-count">16</span>
                </div>
                <p id="pieces-help" class="pieces-help">Choose a piece to begin.</p>
                <div id="pieces-container" class="pieces-grid"></div>
                <details class="rules">
                    <summary>How to play</summary>
                    <p id="rules-text">Make a line of four pieces that share an attribute.</p>
                </details>
            </aside>
        </div>
    </main>

    <script src="/quarto-ui.js"></script>
</body>
</html>
