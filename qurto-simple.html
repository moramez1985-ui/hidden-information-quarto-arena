<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"
          href="//code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <link rel="stylesheet"
          href="/jquery-ui-1.13.2.custom/jquery-ui-1.13.2.custom/jquery-ui.theme.min.css">
    <link rel="stylesheet"

<body>
    <div class="container-fluid w-100 z-0">
        <div class="start-menu">

        </div>
        <div class="game-set container-fluid p-2">
            <div id="board-container"
                 class="container-fluid z-1">
                <div id="board">
                    <div id="row-1">
                        <div id="r1-c1"
                             class="board-sections">+</div>
                        <div id="r2-c1"
                             class="board-sections">+</div>
                        <div id="r3-c1"
                             class="board-sections">+</div>
                        <div id="r4-c1"
                             class="board-sections">+</div>
                    </div>
                    <div id="row-2">
                        <div id="r1-c2"
                             class="board-sections">+</div>
                        <div id="r2-c2"
                             class="board-sections">+</div>
                        <div id="r3-c2"
                             class="board-sections">+</div>
                        <div id="r4-c2"
                             class="board-sections">+</div>
                    </div>
                    <div id="row-3">
                        <div id="r1-c3"
                             class="board-sections">+</div>
                        <div id="r2-c3"
                             class="board-sections">+</div>
                        <div id="r3-c3"
                             class="board-sections">+</div>
                        <div id="r4-c3"
                             class="board-sections">+</div>
                    </div>
                    <div id="row-4">
                        <div id="r1-c4"
                             class="board-sections">+</div>
                        <div id="r2-c4"
                             class="board-sections">+</div>
                        <div id="r3-c4"
                             class="board-sections">+</div>
                        <div id="r4-c4"
                             class="board-sections">+</div>
                    </div>
                    <h1 id="h1">Quarto.</h1>
                </div>
            </div>
            <div id="information">
                <p id="pl">player-1</p>
                <!-- <p id="pl-2">player-2</p> -->
                <div id="think-pad"></div>
                <!-- <button id="undo">undo</button> -->
            </div>
            <div id="pieces-container"
                 class="container-fluid">

                <div class="piece cube light big solid"></div>
                <div class="piece cyl dark big solid"></div>
                <div class="piece cube dark small hole"></div>
                <div class="piece cyl dark big hole"></div>
                <div class="piece cube light big hole"></div>
                <div class="piece cyl light small solid"></div>
                <div class="piece cube dark big hole"></div>
                <div class="piece cube dark small solid"></div>
                <div class="piece cyl light big solid"></div>
                <div class="piece cube light small hole"></div>
                <div class="piece cyl light big hole"></div>
                <div class="piece cyl dark small solid"></div>
                <div class="piece cube light small solid"></div>
                <div class="piece cyl light small hole"></div>
                <div class="piece cube dark big solid"></div>
                <div class="piece cyl dark small hole"></div>

            </div>

        </div>

    </div>











    <script src="/bootstrap-5.3.0-dist/bootstrap-5.3.0-dist/js/bootstrap.bundle.min.js"></script>
    <script src="/qurto-simple.js"></script>
